[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-bridge-mcp"
version = "0.1.0"
description = "Hybrid C# (.NET 8) + Python Computer Vision, HID Input, and Silent-Mode MCP Bridge for Google Antigravity"
readme = "../../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pillow>=10.0.0",
    "mcp>=1.0.0; python_version >= '3.10'",
]

[project.scripts]
antigravity-bridge = "antigravity_mcp.server:main"
